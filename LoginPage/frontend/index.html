<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticação</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configurações e Scripts Personalizados -->
  <script src="js/tailwind-config.js"></script>
  <script src="js/spotlight.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/app.js" defer></script>

  <!-- Estilos Customizados -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-full bg-zinc-950 font-sans text-zinc-100 antialiased selection:bg-zinc-800 selection:text-zinc-100 relative overflow-x-hidden flex items-center justify-center p-4 min-h-screen">

  <!-- Efeito Spotlight Interativo (Lanterna com Radial Gradient) -->
  <div 
    id="spotlight" 
    class="pointer-events-none fixed inset-0 z-0 transition-opacity duration-300" 
    aria-hidden="true"
  ></div>

  <!-- Card Principal com Glassmorphism -->
  <main class="w-full max-w-md bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl shadow-2xl p-8 relative z-10 transition-all duration-300">
    
    <!-- Cabeçalho & Abas (Visíveis apenas nos Estados 1 e 2) -->
    <header id="tabs-container" class="mb-8">
      <div class="flex items-center justify-center mb-6">
        <div class="h-10 w-10 rounded-xl bg-zinc-900 border border-zinc-700/60 flex items-center justify-center shadow-inner">
          <svg class="w-5 h-5 text-zinc-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
      </div>

      <!-- Segmented Control Tabs -->
      <nav class="grid grid-cols-2 p-1 bg-zinc-900/70 border border-zinc-800/80 rounded-xl" role="tablist" aria-label="Ações de Autenticação">
        <button 
          id="tab-login"
          role="tab" 
          aria-selected="true" 
          aria-controls="state-login" 
          class="py-2.5 text-sm font-medium rounded-lg transition-all duration-200 bg-zinc-800 text-zinc-100 shadow-sm border border-zinc-700/40"
        >
          Entrar
        </button>
        <button 
          id="tab-register"
          role="tab" 
          aria-selected="false" 
          aria-controls="state-register" 
          class="py-2.5 text-sm font-medium rounded-lg transition-all duration-200 text-zinc-400 hover:text-zinc-200"
        >
          Registrar
        </button>
      </nav>
    </header>

    <!-- ESTADO 1: Form de Login -->
    <section id="state-login" class="flex flex-col animate-fade-in" aria-labelledby="tab-login">
      <form id="form-login" class="space-y-4">
        <div>
          <label for="login-email" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">E-mail</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-zinc-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" /></svg>
            </span>
            <input 
              id="login-email" 
              type="email" 
              required 
              placeholder="seu@email.com" 
              class="w-full pl-10 pr-4 py-2.5 bg-zinc-900/60 border border-zinc-700/60 rounded-xl text-zinc-100 placeholder-zinc-500 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:border-transparent transition-all"
            >
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label for="login-password" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider">Senha</label>
            <button 
              type="button" 
              id="btn-goto-forgot" 
              class="text-xs text-zinc-400 hover:text-zinc-200 hover:underline transition-colors"
            >
              Esqueci a senha
            </button>
          </div>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-zinc-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
            </span>
            <input 
              id="login-password" 
              type="password" 
              required 
              placeholder="••••••••" 
              class="w-full pl-10 pr-4 py-2.5 bg-zinc-900/60 border border-zinc-700/60 rounded-xl text-zinc-100 placeholder-zinc-500 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:border-transparent transition-all"
            >
            <button type="button" id="btn-toggle-login-password" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-zinc-500 hover:text-zinc-300 transition-colors">
              <!-- Ícone de Olho Aberto -->
  <svg id="eye-open-login" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
  </svg>

  <!-- Ícone de Olho Fechado (Riscado) - Começa oculto -->
  <svg id="eye-closed-login" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
  </svg>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          class="w-full mt-2 py-3 bg-zinc-100 hover:bg-white text-zinc-950 font-semibold rounded-xl text-sm transition-all duration-200 active:scale-[0.99] shadow-lg shadow-white/5"
        >
          Entrar
        </button>
      </form>
    </section>

    <!-- ESTADO 2: Form de Registrar (Sign Up) -->
    <section id="state-register" class="hidden flex-col animate-fade-in" aria-labelledby="tab-register">
      <form id="form-register" class="space-y-4">
        <div>
          <label for="register-name" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Nome Completo</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-zinc-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
            </span>
            <input 
              id="register-name" 
              type="text" 
              required 
              placeholder="Nome Sobrenome" 
              class="w-full pl-10 pr-4 py-2.5 bg-zinc-900/60 border border-zinc-700/60 rounded-xl text-zinc-100 placeholder-zinc-500 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:border-transparent transition-all"
            >
          </div>
        </div>

        <div>
          <label for="register-email" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">E-mail</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-zinc-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" /></svg>
            </span>
            <input 
              id="register-email" 
              type="email" 
              required 
              placeholder="seu@email.com" 
              class="w-full pl-10 pr-4 py-2.5 bg-zinc-900/60 border border-zinc-700/60 rounded-xl text-zinc-100 placeholder-zinc-500 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:border-transparent transition-all"
            >
          </div>
        </div>

        <div>
          <label for="register-password" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Senha</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-zinc-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
            </span>
            <input 
              id="register-password" 
              type="password" 
              required 
              placeholder="••••••••" 
              class="w-full pl-10 pr-4 py-2.5 bg-zinc-900/60 border border-zinc-700/60 rounded-xl text-zinc-100 placeholder-zinc-500 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:border-transparent transition-all"
            >
            <button type="button" id="btn-toggle-register-password" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-zinc-500 hover:text-zinc-300 transition-colors">
  
  <!-- Ícone de Olho Aberto -->
  <svg id="eye-open-register" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
  </svg>
  
  <!-- Ícone de Olho Fechado (Riscado) - Começa oculto -->
  <svg id="eye-closed-register" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
  </svg>

</button>
          </div>
        </div>

        <div>
          <label for="register-confirm-password" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Confirmar Senha</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-zinc-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
            </span>
            <input 
              id="register-confirm-password" 
              type="password" 
              required 
              autocomplete="new-password"
              placeholder="••••••••" 
              class="w-full pl-10 pr-4 py-2.5 bg-zinc-900/60 border border-zinc-700/60 rounded-xl text-zinc-100 placeholder-zinc-500 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:border-transparent transition-all"
            >
            <button type="button" id="btn-toggle-register-password-confirm" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-zinc-500 hover:text-zinc-300 transition-colors">
  
  <!-- Ícone de Olho Aberto -->
  <svg id="eye-open-register-confirm-password" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
  </svg>
  
  <!-- Ícone de Olho Fechado (Riscado) - Começa oculto -->
  <svg id="eye-closed-register-confirm-password" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
  </svg>

</button>
          </div>
        </div>

        <button 
          type="submit" 
          class="w-full mt-2 py-3 bg-zinc-100 hover:bg-white text-zinc-950 font-semibold rounded-xl text-sm transition-all duration-200 active:scale-[0.99] shadow-lg shadow-white/5"
        >
          Criar Conta
        </button>
      </form>
    </section>

    <!-- ESTADO 3: Tela de Esqueci a Senha -->
    <section id="state-forgot" class="hidden flex-col animate-fade-in" aria-label="Recuperação de Senha">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold tracking-tight text-zinc-100">Recuperar Senha</h2>
        <p class="mt-2 text-sm text-zinc-400">
          Informe seu endereço de e-mail cadastrado e enviaremos instruções com o link de recuperação.
        </p>
      </div>

      <form class="space-y-4">
        <div>
          <label for="forgot-email" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">E-mail</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-zinc-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" /></svg>
            </span>
            <input 
              id="forgot-email" 
              type="email" 
              required 
              placeholder="seu@email.com" 
              class="w-full pl-10 pr-4 py-2.5 bg-zinc-900/60 border border-zinc-700/60 rounded-xl text-zinc-100 placeholder-zinc-500 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:border-transparent transition-all"
            >
          </div>
        </div>

        <button 
          type="submit" 
          class="w-full mt-2 py-3 bg-zinc-100 hover:bg-white text-zinc-950 font-semibold rounded-xl text-sm transition-all duration-200 active:scale-[0.99] shadow-lg shadow-white/5"
        >
          Enviar link de recuperação
        </button>

        <div class="text-center pt-2">
          <button 
            type="button" 
            id="btn-back-to-login" 
            class="inline-flex items-center gap-1.5 text-xs text-zinc-400 hover:text-zinc-200 hover:underline transition-colors font-medium"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            Voltar para o Login
          </button>
        </div>
      </form>
    </section>

  </main>

</body>
</html>
